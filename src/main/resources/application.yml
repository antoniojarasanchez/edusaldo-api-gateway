server:
  port: 8099

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:4173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # MS 01: Usuarios y Auth (8081)
        - id: ms-auth-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/usuarios/**, /api/configuracion/**, /api/auditoria/**, /api/contacto/**

        # MS 02: Saldos y Abonos (8082)
        - id: ms-alumnos-saldos
          uri: http://localhost:8082
          predicates:
            - Path=/api/saldos/**

        # MS 03: Productos e Inventario (8083)
        - id: ms-productos-inventario
          uri: http://localhost:8083
          predicates:
            - Path=/api/productos/**, /api/categorias/**, /api/inventario/**

        # MS 04: Reservas y Entregas (8084)
        - id: ms-ventas-reservas
          uri: http://localhost:8084
          predicates:
            - Path=/api/reservas/**, /api/entregas/**, /api/devoluciones/**
