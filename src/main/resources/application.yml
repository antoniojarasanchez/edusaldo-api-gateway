server:
  port: 8099

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:4173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # MS 01: Auth y Usuarios (8081)
        - id: ms-auth-usuarios
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**, /api/usuarios/**

        # MS 02: Alumnos y Saldos (8082)
        - id: ms-alumnos-saldos
          uri: http://localhost:8082
          predicates:
            - Path=/api/alumnos/**, /api/saldos/**

        # MS 03: Productos e Inventario (8083)
        - id: ms-productos-inventario
          uri: http://localhost:8083
          predicates:
            - Path=/api/productos/**, /api/inventario/**

        # MS 04: Ventas y Reservas (8084)
        - id: ms-ventas-reservas
          uri: http://localhost:8084
          predicates:
            - Path=/api/ventas/**, /api/reservas/**

        # MS 05: Compras (8085)
        - id: ms-compras
          uri: http://localhost:8085
          predicates:
            - Path=/api/proveedores/**, /api/ordenes-compra/**, /api/recepciones/**

        # MS 06: Finanzas y Configuración (8086)
        - id: ms-finanzas-configuracion
          uri: http://localhost:8086
          predicates:
            - Path=/api/finanzas/**, /api/periodos/**, /api/config/**
